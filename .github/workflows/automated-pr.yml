name: Automated PR Operations

# This workflow enables automated agents to create PRs, commit, push, and switch branches
# Can be triggered manually or by workflow_dispatch
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operation to perform'
        required: true
        type: choice
        options:
          - create_pr
          - commit_and_push
          - switch_branch
          - create_branch
      branch_name:
        description: 'Branch name (for switch/create operations)'
        required: false
        type: string
      commit_message:
        description: 'Commit message (for commit operations)'
        required: false
        type: string
      pr_title:
        description: 'PR title (for create_pr operation)'
        required: false
        type: string
      pr_body:
        description: 'PR body/description (for create_pr operation)'
        required: false
        type: string
      base_branch:
        description: 'Base branch for PR (default: main)'
        required: false
        type: string
        default: 'main'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  automated-operation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Switch Branch
        if: inputs.operation == 'switch_branch'
        run: |
          echo "Switching to branch: ${{ inputs.branch_name }}"
          git fetch origin
          if git show-ref --verify --quiet refs/heads/${{ inputs.branch_name }}; then
            git checkout ${{ inputs.branch_name }}
          else
            git checkout -b ${{ inputs.branch_name }} origin/${{ inputs.branch_name }}
          fi
          echo "✅ Successfully switched to branch: ${{ inputs.branch_name }}"
      
      - name: Create Branch
        if: inputs.operation == 'create_branch'
        run: |
          echo "Creating new branch: ${{ inputs.branch_name }}"
          git checkout -b ${{ inputs.branch_name }}
          git push -u origin ${{ inputs.branch_name }}
          echo "✅ Successfully created and pushed branch: ${{ inputs.branch_name }}"
      
      - name: Commit and Push
        if: inputs.operation == 'commit_and_push'
        run: |
          echo "Committing changes..."
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "${{ inputs.commit_message }}"
            git push origin HEAD
            echo "✅ Successfully committed and pushed changes"
          fi
      
      - name: Create Pull Request
        if: inputs.operation == 'create_pr'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: ${{ inputs.commit_message || inputs.pr_title }}
          title: ${{ inputs.pr_title }}
          body: ${{ inputs.pr_body }}
          branch: ${{ github.ref_name }}
          base: ${{ inputs.base_branch }}
          delete-branch: false
