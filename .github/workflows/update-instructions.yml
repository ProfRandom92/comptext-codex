name: Auto-Update CompText Instructions

on:
  push:
    paths:
      - 'spec/**'

jobs:
  update-instructions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    # Skip if the last commit was from the bot
    if: "!contains(github.event.head_commit.message, '🤖 Auto-update CompText Instructions')"
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Run build script
        run: python scripts/build_instructions.py
      
      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code .github/copilot-instructions.md || echo "changed=true" >> $GITHUB_OUTPUT
      
      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/copilot-instructions.md
          git commit -m "🤖 Auto-update CompText Instructions"
          git push
