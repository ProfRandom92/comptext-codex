name: Branch Cleanup (Janitor)

# Manual trigger to clean up stale branches
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-branches:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Clean up stale branches
        run: |
          echo "🧹 Starting branch cleanup..."
          echo "Fetching all remote branches..."
          git fetch --all
          
          # Get all remote branches except main using safer parsing
          branches=$(git for-each-ref --format='%(refname:short)' refs/remotes/origin/ | grep -v 'origin/HEAD' | grep -v 'origin/main' | sed 's|^origin/||')
          
          if [ -z "$branches" ]; then
            echo "✅ No stale branches to delete (only main exists)"
            exit 0
          fi
          
          echo "📋 Branches to delete:"
          echo "$branches"
          echo ""
          
          # Delete each branch
          deleted_count=0
          failed_count=0
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            echo "🗑️  Deleting branch: $branch"
            if output=$(git push origin --delete "$branch" 2>&1); then
              echo "✅ Deleted: $branch"
              deleted_count=$((deleted_count + 1))
            else
              echo "❌ Failed to delete: $branch"
              echo "   Error: $output"
              failed_count=$((failed_count + 1))
            fi
          done <<< "$branches"
          
          echo ""
          echo "🎉 Cleanup complete!"
          echo "✅ Successfully deleted: $deleted_count branch(es)"
          if [ $failed_count -gt 0 ]; then
            echo "❌ Failed to delete: $failed_count branch(es)"
          fi
