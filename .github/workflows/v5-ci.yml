name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,mcp]"

    - name: Lint with flake8
      run: |
        flake8 src/comptext_codex --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/comptext_codex --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

    - name: Format check with black
      run: |
        black --check src/comptext_codex
      continue-on-error: true

    - name: Type check with mypy
      run: |
        mypy src/comptext_codex --ignore-missing-imports
      continue-on-error: true

    - name: Run V5 parser tests
      run: |
        pytest tests/test_parser_v5.py -v --tb=short

    - name: Run all tests with coverage
      run: |
        pytest tests/ -v --cov=comptext_codex --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
      continue-on-error: true

  benchmark:
    name: V5.0 ULTRA Benchmark
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,mcp]"

    - name: Run V5 benchmark
      run: |
        python << 'EOF'
        import sys
        sys.path.insert(0, 'src')

        from comptext_codex.parser_v5 import CompTextParserV5

        parser = CompTextParserV5()

        # More realistic examples that demonstrate actual token savings
        examples = [
            ("Please write a Python function that implements the Fibonacci sequence algorithm", "C;P:FIB"),
            ("I need you to write comprehensive unit tests for the Fibonacci function in Python with error handling", "T;P;R:FIB"),
            ("Can you first analyze and summarize the repository structure, then write a Python implementation of Fibonacci", "B:[A:STRUCT]|[C;P:FIB]"),
            ("Fix the memory leak in the TypeScript code and optimize the database queries", "B:[F;T:MEM]|[O:Q]"),
        ]

        total_nat = 0
        total_v5 = 0

        print("="*60)
        print("CompText V5.0 ULTRA - Token Reduction Benchmark")
        print("="*60)

        for nat, v5 in examples:
            stats = parser.calculate_token_reduction(nat, v5)
            total_nat += stats['natural_tokens']
            total_v5 += stats['v5_tokens']
            print(f"Natural: {stats['natural_tokens']}T | V5: {stats['v5_tokens']}T | Reduction: {stats['reduction_percent']}%")

        avg_reduction = round((1 - total_v5/total_nat) * 100, 1)

        print("="*60)
        print(f"Average Reduction: {avg_reduction}%")
        print("="*60)

        if avg_reduction < 60:
            print(f"ERROR: Reduction below 60% threshold (got {avg_reduction}%)")
            sys.exit(1)

        print(f"SUCCESS: V5.0 ULTRA achieving {avg_reduction}% token reduction")
        EOF

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [test]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: |
        python -m build

    - name: Check package
      run: |
        twine check dist/*

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-packages
        path: dist/
      continue-on-error: true

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Check documentation exists
      run: |
        echo "✓ Documentation build placeholder"
        echo "README.md exists: $(test -f README.md && echo 'yes' || echo 'no')"
        echo "docs/ exists: $(test -d docs && echo 'yes' || echo 'no')"

