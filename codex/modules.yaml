  - code: M
    name: MCP Integration
    purpose: Multi-agent messaging, tool routing, and contract governance
    token_priority: high
    mcp_exposed: true
    security:
      pii_safe: true
      threat_model: capability_scoped
      audit_trail: request_id+session_id
    privacy:
      dp_budget: epsilon<=0.2_per_exchange
      federated_ready: true
