[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comptext-codex"
version = "5.0.4"
description = "CompText V5.0 ULTRA: 94% token reduction protocol for LLM interactions"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ProfRandom92", email = "your.email@example.com"},
    {name = "Claude Sonnet 4.5", email = "noreply@anthropic.com"}
]
maintainers = [
    {name = "ProfRandom92", email = "your.email@example.com"}
]
keywords = [
    "llm",
    "dsl",
    "token-optimization",
    "token-reduction",
    "ai",
    "nlp",
    "language",
    "mcp",
    "comptext",
    "compression",
    "efficiency",
    "cost-savings",
    "api-optimization",
    "ultra",
    "v5"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Communications",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0.0",
    "typing-extensions>=4.5.0",
    "PyYAML>=6.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "tiktoken>=0.5.0",
]

[project.scripts]
comptext = "comptext_codex.cli_v5:main"
comptext-v4 = "comptext_codex.cli:main"
comptext-mcp = "comptext_codex.mcp_server_v5:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]
docs = [
    "mkdocs-material>=9.5.0",
    "mkdocs-minify-plugin>=0.8.0",
]
mcp = [
    "mcp>=0.1.0",
]
all = [
    "mcp>=0.1.0",
]

[project.urls]
Homepage = "https://comptext-txsu.vercel.app"
Documentation = "https://profrandom92.github.io/comptext-docs"
Repository = "https://github.com/ProfRandom92/comptext-codex"
Issues = "https://github.com/ProfRandom92/comptext-codex/issues"
Changelog = "https://github.com/ProfRandom92/comptext-codex/blob/main/docs/CHANGELOG_V5.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
comptext_codex = ["py.typed"]
"*" = ["*.md", "*.yaml", "*.yml"]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
strict = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true
warn_unreachable = true

[tool.pytest.ini_options]
minversion = "7.4"
addopts = "-ra -q --strict-markers --cov=comptext_codex --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
